<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خدمات و رزرو | تشریفات خاطره</title><style>body{margin:0;background:#090806;color:#fff7ea;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:25px}.card,.box{background:#15110e;border:1px solid #30271f;border-radius:18px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{cursor:pointer}.card:hover{border-color:#d1aa70}.gold{background:#d1aa70;color:#171108;border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer}.muted{color:#b8aa9c}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:1px solid #30271f;border-radius:12px;padding:13px;cursor:pointer}.choice.selected{border-color:#d1aa70;background:#d1aa7018}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;padding:12px;box-sizing:border-box;background:#0b0908;color:white;border:1px solid #30271f;border-radius:9px;margin-top:5px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.check{border:1px solid #30271f;border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;cursor:pointer}.check input{width:auto;margin:0}.selected-service{border-color:#d1aa70;background:#d1aa7012}@media(max-width:700px){.grid,.choices,.checks,.row{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid,.choices,.checks,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="index.html" style="color:#d1aa70">← بازگشت به سایت</a><h1>خدمات و رزرو</h1><p class="muted">می‌توانی فقط یک خدمت یا چند خدمت را هم‌زمان انتخاب و در یک درخواست رزرو ارسال کنی.</p><div id="grid" class="grid"></div><div class="box"><h2>خدمات انتخاب‌شده</h2><div id="selected" class="muted">هنوز خدمتی انتخاب نشده.</div><button id="continue" class="gold hidden" onclick="start()">ادامه و انتخاب جزئیات</button></div><div id="wizard" class="box hidden"><h2>جزئیات رزرو</h2><div id="options"></div><div class="row"><label>نام<input id="name"></label><label>شماره تماس<input id="phone"></label></div><div class="row"><label>تاریخ<input id="date" type="date"></label><label>تعداد مهمان<input id="guests" type="number"></label></div><div class="box"><h3>خلاصه سفارش</h3><div id="summary" class="muted">—</div><button class="gold" onclick="send()">تأیید و ارسال همه خدمات به واتساپ</button></div></div></div><script>const S={men:{t:'قسمت آقایان',d:'فضای اختصاصی آقایان با چیدمان شیک و تجهیزات دکوراتیو.',o:['wall','floor']},women:{t:'قسمت بانوان',d:'فضای بانوان با چیدمان اختصاصی و امکان انتخاب سرپوشیده.',o:['wall','floor'],cover:true},group:{t:'جایگاه گروه',d:'جایگاه گروه با دیواره، کف و فرش یا موکت.',o:['wall','floor','carpet']},stage:{t:'استیج',d:'استیج اختصاصی مراسم.',o:['wall','floor','carpet']},decor:{t:'دکوراسیون و گل‌آرایی',d:'طراحی دکور و گل‌آرایی.',o:['wall','floor','carpet']},catering:{t:'پذیرایی و تشریفات',d:'هماهنگی پذیرایی و مدیریت مراسم.',o:[]},lighting:{t:'نورپردازی',d:'نورپردازی مراسم.',o:['wall','floor']},dance:{t:'رقص نور',d:'رقص نور و جلوه‌های نوری برای مراسم.',o:[]},design:{t:'طراحی مراسم',d:'طراحی کانسپت و چیدمان مراسم.',o:[]}};const A={wall:['دیواره بنفش — ۲ متر','دیواره بنفش — ۳ متر','دیواره آبی — ۲ متر','دیواره آبی — ۳ متر','دیواره سفید — ۲ متر','دیواره سفید — ۳ متر'],floor:['کف قرمز — ۲ متر','کف قرمز — ۳ متر','کف آبی — ۲ متر','کف آبی — ۳ متر','کف مشکی — ۲ متر'],carpet:['موکت آبی','موکت قرمز','فرش آبی','فرش قرمز','فرش کرم']};let selected=[],details={};for(const [id,s] of Object.entries(S)){let e=document.createElement('div');e.className='card';e.innerHTML='<b>'+s.t+'</b><p class="muted">'+s.d+'</p>';e.onclick=()=>toggle(id,e);grid.appendChild(e)}function toggle(id,e){if(selected.includes(id)){selected=selected.filter(x=>x!==id);e.classList.remove('selected-service');delete details[id]}else{selected.push(id);e.classList.add('selected-service')}renderSelected()}function renderSelected(){selectedEl=document.getElementById('selected');selectedEl.innerHTML=selected.length?selected.map(id=>'✓ '+S[id].t).join('<br>'):'هنوز خدمتی انتخاب نشده.';document.getElementById('continue').classList.toggle('hidden',!selected.length)}function start(){wizard.classList.remove('hidden');let html='';selected.forEach(id=>{let s=S[id];details[id]=details[id]||{};html+='<div class="box"><h3>'+s.t+'</h3>';if(s.cover)html+='<label class="check"><input type="checkbox" onchange="details[\''+id+'\'].cover=this.checked;update()"> قسمت بانوان سرپوشیده</label>';for(const k of s.o){let title={wall:'دیواره داربست',floor:'کف جایگاه',carpet:'فرش و موکت'}[k];html+='<h4>'+title+'</h4><div class="choices">'+A[k].map((x,i)=>'<div class="choice" onclick="choose(\''+id+'\',\''+k+'\','+i+',this)">'+x+'</div>').join('')+'</div>'}html+='</div>'});document.getElementById('options').innerHTML=html;update();wizard.scrollIntoView({behavior:'smooth'})}function choose(id,k,i,e){details[id]=details[id]||{};details[id][k]=A[k][i];e.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');update()}function update(){let x='';selected.forEach(id=>{let d=details[id]||{};x+='• '+S[id].t+'\n';if(S[id].cover)x+='  سرپوشیده: '+(d.cover?'بله':'خیر')+'\n';if(S[id].o.includes('wall'))x+='  دیواره: '+(d.wall||'انتخاب نشده')+'\n';if(S[id].o.includes('floor'))x+='  کف: '+(d.floor||'انتخاب نشده')+'\n';if(S[id].o.includes('carpet'))x+='  فرش/موکت: '+(d.carpet||'انتخاب نشده')+'\n'});x+='\nنام: '+(name.value||'—')+'\nتاریخ: '+(date.value||'—')+'\nمهمان: '+(guests.value||'—');summary.textContent=x||'—'}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',update));function send(){if(!selected.length)return alert('حداقل یک خدمت را انتخاب کنید.');if(!name.value||!phone.value)return alert('نام و شماره تماس را وارد کنید.');let x=summary.textContent+'\nشماره تماس: '+phone.value;location.href='https://wa.me/989105471748?text='+encodeURIComponent('سلام، درخواست رزرو چند خدمت دارم:\n'+x)}</script></body></html>
