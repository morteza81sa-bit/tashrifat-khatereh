<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خدمات و رزرو | تشریفات خاطره</title><style>body{margin:0;background:#090806;color:#fff7ea;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:25px}.card,.box{background:#15110e;border:1px solid #30271f;border-radius:18px;padding:20px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{cursor:pointer}.card:hover{border-color:#d1aa70}.gold{background:#d1aa70;color:#171108;border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer}.muted{color:#b8aa9c}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:1px solid #30271f;border-radius:12px;padding:13px;cursor:pointer}.choice.selected{border-color:#d1aa70;background:#d1aa7018}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;padding:12px;box-sizing:border-box;background:#0b0908;color:white;border:1px solid #30271f;border-radius:9px;margin-top:5px}@media(max-width:700px){.grid,.choices,.row{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid,.choices,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="index.html" style="color:#d1aa70">← بازگشت به سایت</a><h1>خدمات و رزرو</h1><p class="muted">خدمت را انتخاب کن؛ بعد از توضیحات، فقط گزینه‌های مخصوص همان خدمت نمایش داده می‌شود.</p><div id="grid" class="grid"></div><div id="detail" class="box hidden"></div><div id="wizard" class="box hidden"><h2>جزئیات رزرو</h2><div id="womenCover" class="box hidden"><label style="display:flex;gap:10px;align-items:center;cursor:pointer"><input id="covered" type="checkbox" style="width:auto"> <span><b>قسمت بانوان سرپوشیده</b><br><small class="muted">اگر فضای بانوان را سرپوشیده می‌خواهید، این گزینه را تیک بزنید.</small></span></label></div><div id="wallBox"><h3>دیواره داربست</h3><div id="walls" class="choices"></div></div><div id="floorBox"><h3>کف جایگاه</h3><div id="floors" class="choices"></div></div><div id="carpetBox"><h3>فرش و موکت</h3><div id="carpets" class="choices"></div></div><div class="row"><label>نام<input id="name"></label><label>شماره تماس<input id="phone"></label></div><div class="row"><label>تاریخ<input id="date" type="date"></label><label>تعداد مهمان<input id="guests" type="number"></label></div><div class="box"><h3>خلاصه</h3><div id="summary" class="muted">—</div><button class="gold" onclick="send()">ارسال رزرو به واتساپ</button></div></div></div><script>const S={men:{t:'قسمت آقایان',d:'فضای اختصاصی آقایان با چیدمان شیک و تجهیزات دکوراتیو.',o:['wall','floor']},women:{t:'قسمت بانوان',d:'فضای بانوان با چیدمان اختصاصی. در صورت تمایل می‌توانید فضای سرپوشیده را انتخاب کنید.',o:['wall','floor'],cover:true},group:{t:'جایگاه گروه',d:'جایگاه گروه با امکان انتخاب دیواره، کف و فرش یا موکت.',o:['wall','floor','carpet']},stage:{t:'استیج',d:'استیج اختصاصی مراسم.',o:['wall','floor','carpet']},decor:{t:'دکوراسیون و گل‌آرایی',d:'طراحی دکور و گل‌آرایی.',o:['wall','floor','carpet']},catering:{t:'پذیرایی و تشریفات',d:'هماهنگی پذیرایی و مدیریت مراسم.',o:[]},lighting:{t:'نورپردازی',d:'نورپردازی مراسم؛ بدون فرش و موکت.',o:['wall','floor']},design:{t:'طراحی مراسم',d:'طراحی کانسپت و چیدمان مراسم.',o:[]}};const A={wall:['دیواره بنفش — ۲ متر','دیواره بنفش — ۳ متر','دیواره آبی — ۲ متر','دیواره آبی — ۳ متر','دیواره سفید — ۲ متر','دیواره سفید — ۳ متر'],floor:['کف قرمز — ۲ متر','کف قرمز — ۳ متر','کف آبی — ۲ متر','کف آبی — ۳ متر','کف مشکی — ۲ متر'],carpet:['موکت آبی','موکت قرمز','فرش آبی','فرش قرمز','فرش کرم']};let cur='',pick={};for(const [id,s] of Object.entries(S)){let e=document.createElement('div');e.className='card';e.innerHTML='<b>'+s.t+'</b><p class="muted">'+s.d+'</p>';e.onclick=()=>show(id,e);grid.appendChild(e)}function show(id,e){cur=id;pick={};document.querySelectorAll('.card').forEach(x=>x.style.borderColor='#30271f');e.style.borderColor='#d1aa70';detail.classList.remove('hidden');detail.innerHTML='<h2>'+S[id].t+'</h2><p class="muted">'+S[id].d+'</p><ul>'+S[id].o.map(x=>'<li>'+({wall:'دیواره داربست',floor:'کف جایگاه',carpet:'فرش و موکت'}[x])+'</li>').join('')+'</ul><button class="gold" onclick="start()">رزرو این خدمت</button>';wizard.classList.add('hidden');detail.scrollIntoView({behavior:'smooth'})}function start(){wizard.classList.remove('hidden');womenCover.classList.toggle('hidden',!S[cur].cover);for(const k of ['wall','floor','carpet'])document.getElementById(k+'Box').classList.toggle('hidden',!S[cur].o.includes(k));for(const k of S[cur].o)render(k);summary();wizard.scrollIntoView({behavior:'smooth'})}function render(k){document.getElementById(k==='wall'?'walls':k==='floor'?'floors':'carpets').innerHTML=A[k].map((x,i)=>'<div class="choice" onclick="choose(\''+k+'\','+i+')">'+x+'</div>').join('')}function choose(k,i){pick[k]=A[k][i];document.querySelectorAll('#'+(k==='wall'?'walls':k==='floor'?'floors':'carpets')+' .choice').forEach((x,j)=>x.classList.toggle('selected',j===i));summary()}function summary(){let x='خدمت: '+(S[cur]?.t||'—')+'\n';if(cur==='women')x+='بانوان سرپوشیده: '+(covered.checked?'بله':'خیر')+'\n';for(const k of S[cur]?.o||[])x+=({wall:'دیواره',floor:'کف',carpet:'فرش/موکت'}[k])+': '+(pick[k]||'انتخاب نشده')+'\n';x+='نام: '+(name.value||'—')+'\nتاریخ: '+(date.value||'—')+'\nمهمان: '+(guests.value||'—');summaryEl.textContent=x}const summaryEl=document.getElementById('summary');document.querySelectorAll('input').forEach(x=>x.addEventListener('input',summary));function send(){if(!name.value||!phone.value)return alert('نام و شماره تماس را وارد کنید.');let x=summaryEl.textContent+'\nشماره تماس: '+phone.value;location.href='https://wa.me/989105471748?text='+encodeURIComponent('سلام، درخواست رزرو دارم:\n'+x)}</script></body></html>
